name: Verify

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run build --workspace=@asmr/shared
      - run: npm test --workspace=@asmr/shared -- --runInBand
      - name: Audit production Functions dependencies
        run: |
          npm -w @asmr/shared pack --pack-destination packages/backend --silent
          git diff --exit-code -- packages/backend/asmr-shared-1.0.0.tgz
          audit_dir="$(mktemp -d)"
          trap 'rm -rf "$audit_dir"' EXIT
          cp packages/backend/package.json packages/backend/package-lock.json packages/backend/asmr-shared-1.0.0.tgz "$audit_dir/"
          cd "$audit_dir"
          npm ci --omit=dev --ignore-scripts --no-audit
          npm audit --omit=dev --audit-level=high
      - run: npm run build --workspace=@asmr/backend
      - run: npm test --workspace=@asmr/backend -- --runInBand
      - run: npm install --global firebase-tools@15.14.0
      - run: firebase emulators:exec --project demo-asmr-paid-rules --only firestore 'node packages/backend/scripts/test-paid-firestore-rules.cjs'
      - run: npm run build --workspace=@asmr/mobile
      - run: npm test --workspace=@asmr/mobile -- --runInBand
      - run: npx expo-doctor
        working-directory: packages/mobile
